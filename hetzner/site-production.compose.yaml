name: granttap-site-production
services:
  site:
    labels:
      io.hostwatch.workload: granttap-web
      io.podman.compose.service: site
    container_name: granttap-web-site-1
    image: ${GRANTTAP_SITE_RELEASE_IMAGE:?Set the verified site image tag}
    restart: unless-stopped
    init: true
    environment:
      PORT: "3211"
      HOST: "0.0.0.0"
      NODE_ENV: production
      VINEXT_TRUST_PROXY: "1"
      VINEXT_TRUSTED_HOSTS: "granttap.com,www.granttap.com"
    ports:
      - "127.0.0.1:3211:3211"
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 20s
