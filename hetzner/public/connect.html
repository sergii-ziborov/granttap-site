<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Connect your coding app · GrantTap</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0b0b0c; color: #f5f2ee; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
    main { flex: 1; display: grid; place-items: start center; padding: 12px 20px 64px; }
    .card { width: min(640px, 100%); padding: 36px 32px 32px; border: 1px solid #2a2a2c; border-radius: 28px; background: #141416; }
    .eyebrow { margin: 0 0 10px; color: #8d8d90; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 6vw, 52px); line-height: 1.05; }
    .lead { margin: 0 0 22px; color: #b7b7ba; }
    .panel { margin: 0 0 18px; padding: 18px; border-radius: 18px; border: 1px solid #3a2a1f; background: #1b1612; }
    .panel.ok { border-color: #2c2f35; background: #1a1c20; }
    .panel h2 { margin: 0 0 6px; font-size: 16px; }
    .panel p { margin: 0; color: #b7b7ba; }
    .chip { display: inline-flex; margin: 0 8px 16px 0; padding: 10px 16px; border-radius: 999px; background: #2a2a2c; font-weight: 700; }
    .apps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .app { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: #111214; }
    .app i { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .app.ready i { background: #7dce6a; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .primary { background: #f47a45; color: #161616; }
    .ghost { background: #2a2a2c; color: #f6f6f6; }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">GrantTap</a>
      <a href="/">Home</a>
    </header>
    <main>
      <section class="card">
        <p class="eyebrow">GrantTap authorization</p>
        <h1>Connect your coding app</h1>
        <p class="lead">GrantTap is asking to send approvals and activity from this coding app to your phone.</p>
        <div id="root"></div>
      </section>
    </main>
  </div>
  <script>
    const labels = { cursor: "Cursor", claude: "Claude Code", codex: "Codex" };
    const id = new URLSearchParams(location.hash.replace(/^#/, "")).get("request") || "";
    const root = document.getElementById("root");
    let busy = false;

    function panel(title, body, ok) {
      return `<div class="panel${ok ? " ok" : ""}"><h2>${title}</h2><p>${body}</p></div>`;
    }
    function render(row, missing) {
      if (missing) {
        root.innerHTML = panel(
          "This request is not on GrantTap yet.",
          "Start authorization again from your coding app. This page never talks to localhost."
        );
        return;
      }
      if (!row) { root.innerHTML = ""; return; }
      if (row.redirectUrl) { location.assign(row.redirectUrl); return; }
      const apps = (row.providers || []).map((p) =>
        `<span class="app${p.ready ? " ready" : ""}"><i></i>${labels[p.id] || p.id} · ${
          p.ready ? "Ready" : p.installed ? "Installed" : "Not installed"
        }</span>`
      ).join("");
      root.innerHTML = `
        <span class="chip">${row.clientName || "Coding app"}</span>
        ${panel(
          row.paired ? "A phone is already connected" : "This computer is not paired yet.",
          row.paired
            ? "You can approve this coding app without changing your existing connection."
            : "Scan the QR in the GrantTap plugin or the iPhone app, then approve here.",
          row.paired
        )}
        <div class="panel ok"><h2>Coding apps on this computer</h2><div class="apps">${apps}</div></div>
        ${row.error ? panel("The coding app could not finish authorization.", row.error) : ""}
        ${row.decision && !row.redirectUrl && !row.error ? `<p class="lead">Waiting for this computer…</p>` : ""}
        <div class="actions">
          <button class="primary" id="approve" ${row.decision || busy ? "disabled" : ""}>Approve</button>
          <button class="ghost" id="deny" ${row.decision || busy ? "disabled" : ""}>Deny</button>
        </div>`;
      document.getElementById("approve")?.addEventListener("click", () => decide("approve"));
      document.getElementById("deny")?.addEventListener("click", () => decide("deny"));
    }
    async function tick() {
      if (!id) { render(null, true); return; }
      const response = await fetch("/api/connect/requests/" + id, { cache: "no-store" });
      if (response.status === 404) { render(null, true); return; }
      if (!response.ok) return;
      render(await response.json(), false);
    }
    async function decide(decision) {
      if (!id || busy) return;
      busy = true;
      await fetch("/api/connect/requests/" + id + "/decision", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ decision }),
      });
      busy = false;
      tick();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
