name: granttap-web

services:
  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: "3210"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3210:3210"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
