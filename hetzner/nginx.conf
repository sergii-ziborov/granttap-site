limit_req_zone $binary_remote_addr zone=granttap_web_ip:10m rate=20r/s;
limit_req_zone $server_name zone=granttap_web_global:1m rate=400r/s;

server {
    include /etc/nginx/snippets/hostwatch-access-enforcement.conf;
    listen 80;
    listen [::]:80;
    server_name granttap.com www.granttap.com;

    include /etc/nginx/snippets/hostwatch-access-log.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        include /etc/nginx/snippets/hostwatch-access-log.conf;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    include /etc/nginx/snippets/hostwatch-access-enforcement.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name granttap.com www.granttap.com;

    ssl_certificate /etc/letsencrypt/live/granttap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/granttap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/hostwatch-access-log.conf;
    error_log /var/log/nginx/granttap-web-error.log warn;
    client_header_timeout 3s;
    client_body_timeout 8s;
    keepalive_timeout 10s;
    send_timeout 15s;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    if ($host = www.granttap.com) { return 308 https://granttap.com$request_uri; }

    location ^~ /api/connect/ {
        limit_conn connections_per_ip 20;
        limit_req zone=granttap_web_ip burst=40 nodelay;
        limit_req zone=granttap_web_global burst=200 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location ^~ /connect {
        limit_conn connections_per_ip 20;
        limit_req zone=granttap_web_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3210;
    }

    location / {
        limit_conn connections_per_ip 20;
        limit_req zone=granttap_web_ip burst=40 nodelay;
        proxy_pass https://185.158.133.1;
        proxy_ssl_server_name on;
        proxy_ssl_name granttap.com;
        proxy_set_header Host granttap.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
